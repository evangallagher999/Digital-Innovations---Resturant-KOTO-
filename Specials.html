<script>
    const specials = [
        { emoji:'🍣', img:'images/specials1.jpg', name:'Wagyu Nigiri Selection', price:'€24.00', desc:'Hand-pressed wagyu beef nigiri with ponzu glaze and micro shiso. A luxurious take on the classic.' },
        { emoji:'🦞', img:'images/specials2.jpg', name:'Lobster Miso Ramen',     price:'€28.00', desc:'Rich lobster broth blended with aged white miso, topped with half a lobster tail and crispy shallots.' },
        { emoji:'🥩', img:'images/specials3.jpg', name:'Kobe Beef Tataki',       price:'€32.00', desc:'Lightly seared A5 Kobe beef sliced thin, dressed with yuzu kosho vinaigrette and toasted sesame.' },
        { emoji:'🍡', img:'images/specials4.jpg', name:'Matcha Mochi Trio',      price:'€9.50',  desc:'Three seasonal mochi: ceremonial matcha, black sesame, and roasted hojicha. A perfect finish.' },
    ];

    buildSlideshow('specialsSlides', 'specialsDots', specials, 'Special');

    function buildSlideshow(slidesId, dotsId, data, prefix) {
        const slidesEl = document.getElementById(slidesId);
        const dotsEl   = document.getElementById(dotsId);
        let current = 0;

        data.forEach((item, i) => {
            const slide = document.createElement('div');
            slide.className = 'dish-slide' + (i===0 ? ' active' : '');
            slide.innerHTML = `
                <div class="dish-slide-img emoji-placeholder" id="${prefix}-img-${i}">${item.emoji}</div>
                <div class="dish-details">
                    <div class="dish-details-text"><h3>${item.name}</h3><p>${item.desc}</p></div>
                    <span class="dish-price">${item.price}</span>
                </div>`;
            slidesEl.appendChild(slide);

            const img = new Image();
            img.onload = () => {
                const el = document.getElementById(`${prefix}-img-${i}`);
                el.innerHTML = `<img src="${item.img}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;">`;
                el.classList.remove('emoji-placeholder'); el.style.background='none';
            };
            img.src = item.img;

            const dot = document.createElement('span');
            if (i===0) dot.classList.add('active');
            dot.addEventListener('click', () => go(i));
            dotsEl.appendChild(dot);
        });

        const slides = slidesEl.querySelectorAll('.dish-slide');
        const dots   = dotsEl.querySelectorAll('span');

        function go(n) {
            slides[current].classList.remove('active'); dots[current].classList.remove('active');
            current = (n + data.length) % data.length;
            slides[current].classList.add('active'); dots[current].classList.add('active');
        }

        window[`change${prefix}`] = (dir) => go(current + dir);
        setInterval(() => go(current + 1), 4000);
    }
</script>
</body>
