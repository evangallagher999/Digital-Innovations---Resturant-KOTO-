<script>
    const beverages = [
        { emoji:'🍶', img:'images/bev1.jpg', name:'Sake Flight',          price:'€14.00', desc:'Three curated sake selections — junmai, ginjo, and daiginjo — served at ideal temperature.' },
        { emoji:'🍵', img:'images/bev2.jpg', name:'Ceremonial Matcha',    price:'€5.50',  desc:'Stone-ground ceremonial grade matcha whisked to a perfect froth. Earthy, smooth and vibrant.' },
        { emoji:'🍺', img:'images/bev3.jpg', name:'Japanese Draft Lager', price:'€6.50',  desc:'Crisp, light lager imported directly from Japan. Clean bitterness and refreshing finish.' },
        { emoji:'🍹', img:'images/bev4.jpg', name:'Yuzu Highball',        price:'€9.00',  desc:'Japanese whisky, fresh yuzu juice, honey syrup and premium soda water. Bright and balanced.' },
        { emoji:'🥤', img:'images/bev5.jpg', name:'Ramune Soda',          price:'€3.50',  desc:'Classic Japanese marble-seal soda in original, strawberry or melon flavour. Fun for all ages.' },
    ];

    buildSlideshow('bevSlides', 'bevDots', beverages, 'Bev');

    function buildSlideshow(slidesId, dotsId, data, prefix) {
        const slidesEl = document.getElementById(slidesId);
        const dotsEl   = document.getElementById(dotsId);
        let current = 0;

        data.forEach((item, i) => {
            const slide = document.createElement('div');
            slide.className = 'dish-slide' + (i===0 ? ' active' : '');
            slide.innerHTML = `
                <div class="dish-slide-img emoji-placeholder" id="${prefix}-img-${i}">${item.emoji}</div>
                <div class="dish-details">
                    <div class="dish-details-text"><h3>${item.name}</h3><p>${item.desc}</p></div>
                    <span class="dish-price">${item.price}</span>
                </div>`;
            slidesEl.appendChild(slide);

            const img = new Image();
            img.onload = () => {
                const el = document.getElementById(`${prefix}-img-${i}`);
                el.innerHTML = `<img src="${item.img}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;">`;
                el.classList.remove('emoji-placeholder'); el.style.background='none';
            };
            img.src = item.img;

            const dot = document.createElement('span');
            if (i===0) dot.classList.add('active');
            dot.addEventListener('click', () => go(i));
            dotsEl.appendChild(dot);
        });

        const slides = slidesEl.querySelectorAll('.dish-slide');
        const dots   = dotsEl.querySelectorAll('span');

        function go(n) {
            slides[current].classList.remove('active'); dots[current].classList.remove('active');
            current = (n + data.length) % data.length;
            slides[current].classList.add('active'); dots[current].classList.add('active');
        }

        window[`change${prefix}`] = (dir) => go(current + dir);
        setInterval(() => go(current + 1), 4000);
    }
</script>
