<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="mystyle.css">
    <link rel="icon" type="image/jpg" href="images/favicon.jpg">
    <title>Login</title>
</head>
<body>

<header>
    <div class="header-container">
        <div class="site-brand">
            <h1>Koto</h1>
            <img src="images/koto-logo.jpg" alt="Koto Logo">
        </div>
        <nav class="site-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="business_hours.html">Hours</a></li>
                <li><a href="reservations.html">Reservations</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="login.html">Login</a></li>
                <li class="nav-dropdown">
                    <button class="nav-dropdown-btn">Menu <i class="fa fa-caret-down"></i></button>
                    <div class="nav-dropdown-menu">
                        <a href="Specials.html">Specials</a>
                        <a href="Mains.html">Mains</a>
                        <a href="Beverages.html">Beverages</a>
                    </div>
                </li>
                <li class="nav-search">
                    <input type="text" id="searchBox" placeholder="Search..." onkeypress="if(event.key==='Enter') searchSite()">
                    <button onclick="searchSite()">Search</button>
                </li>
            </ul>
        </nav>
    </div>
</header>

<div class="login-wrapper">
    <div class="login-box">
        <h1>Login</h1>
        <span class="login-subtitle">Welcome back — sign in to your account</span>

        <div class="login-success" id="successMessage">
            ✅ Login successful! Redirecting…
        </div>

        <div class="login-field">
            <i class="fas fa-user login-field-icon"></i>
            <input type="text" id="username" placeholder="Username" required>
        </div>

        <div class="login-field">
            <i class="fas fa-lock login-field-icon"></i>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="login-options">
            <label><input type="checkbox"> Remember me</label>
            <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button class="login-btn" onclick="handleLogin()">Login</button>

        <div class="register-prompt">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 Koto. All rights reserved.</p>
    <div class="map-container">
        <iframe src="https://www.google.com/maps?q=6+Carey%27s+Lane,+Cork,+Ireland&output=embed" allowfullscreen="" loading="lazy"></iframe>
    </div>
    <div class="social">
        <a href="https://www.facebook.com/KotoCork/photos/" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com/kotocork" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://x.com/jeff_koto" target="_blank"><i class="fab fa-x-twitter"></i></a>
    </div>
</footer>

<script src="search.js"></script>
<script>
    function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const msg = document.getElementById('successMessage');

        if (!username || !password) {
            alert('Please enter both a username and password.');
            return;
        }

        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 5000);
    }

    document.addEventListener('keypress', e => {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
